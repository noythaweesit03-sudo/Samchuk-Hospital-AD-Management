name: CI Pipeline - Samchuk Hospital AD Management

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  frontend-validation:
    name: Frontend (React / TypeScript / Lint / Test / Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Lint / Typecheck
        run: npm run lint

      - name: Run Automated Unit Tests (RBAC, Mock API, Pagination, Input Validation, AD Write Lock)
        run: npm test

      - name: Build Frontend Production Bundle
        run: npm run build

  backend-validation:
    name: Backend (.NET 8 / C# / Solution Build / xUnit Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore backend/SamchukHospital.AdManagement.sln

      - name: Build ASP.NET Core Solution
        run: dotnet build backend/SamchukHospital.AdManagement.sln --no-restore --configuration Release

      - name: Run Backend Unit Tests (UserFilterTests & Phase2AReadinessTests)
        run: dotnet test backend/SamchukHospital.AdManagement.sln --no-build --configuration Release --verbosity normal
